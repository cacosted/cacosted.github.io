<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos de Cacosted</title>
<meta name="description" content="Herramientas del canal y helpers para jugar Pokémon.">
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1c1c1f;
    --muted: #64646c;
    --line: #e3e1dc;
    --accent: #e8453c;
    --chip: #ecebe7;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 6px 20px rgba(0,0,0,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --card: #1d1d21;
      --text: #ececef;
      --muted: #9a9aa3;
      --line: #2c2c32;
      --accent: #ff5f55;
      --chip: #26262b;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 1120px; margin: 0 auto; padding: 48px 16px 64px; }
  header h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0 0 8px; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--muted); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin: 28px 0 24px; }
  .filtros button {
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--text);
    border-radius: 999px;
    padding: 6px 14px;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
  }
  .filtros button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); }
  .card {
    display: flex;
    flex-direction: column;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:hover, .card:focus-visible { transform: translateY(-2px); border-color: var(--accent); outline: none; }
  .thumb { aspect-ratio: 16 / 10; background: var(--chip); border-bottom: 1px solid var(--line); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .seccion + .seccion { margin-top: 44px; }
  .seccion h2 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .seccion .nota { margin: 2px 0 16px; color: var(--muted); font-size: 15px; }
  .body h3 { font-size: 18px; margin: 0; }
  .body p { margin: 0; color: var(--muted); font-size: 15px; flex: 1; }
  .url { font-size: 13px; color: var(--accent); overflow-wrap: anywhere; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Proyectos de Cacosted</h1>
    <p>Herramientas del canal, helpers de Pokémon y algunos proyectos por diversión.</p>
  </header>

  <nav class="filtros" aria-label="Filtrar proyectos">
    <button type="button" data-cat="todos" aria-pressed="true">Todos</button>
    <button type="button" data-cat="canal" aria-pressed="false">Para el canal</button>
    <button type="button" data-cat="pokemon" aria-pressed="false">Pokémon</button>
    <button type="button" data-cat="diversion" aria-pressed="false">Por diversión</button>
  </nav>

  <div id="grid" aria-live="polite"></div>

  <footer>Para agregar un proyecto, suma una entrada en <code>proyectos.json</code>.</footer>
</main>

<script>
  const SECCIONES = [
    { cat: "canal", titulo: "Para el canal", nota: "Herramientas para hacer los videos." },
    { cat: "pokemon", titulo: "Pokémon", nota: "Helpers para jugar y preparar runs." },
    { cat: "diversion", titulo: "Por diversión", nota: "Proyectos personales, fuera del canal." }
  ];
  const grid = document.getElementById("grid");
  let proyectos = [];

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function tarjeta(p) {
    return `
      <a class="card" href="${esc(p.url)}" target="_blank" rel="noopener">
        <div class="thumb"><img src="${esc(p.miniatura)}" alt="Captura de ${esc(p.nombre)}" loading="lazy" width="800" height="500"></div>
        <div class="body">
          <h3>${esc(p.nombre)}</h3>
          <p>${esc(p.descripcion)}</p>
          <span class="url">${esc(p.url.replace(/^https?:\/\//, "").replace(/\/$/, ""))}</span>
        </div>
      </a>`;
  }

  function pintar(cat) {
    const secciones = cat === "todos" ? SECCIONES : SECCIONES.filter(s => s.cat === cat);
    grid.innerHTML = secciones.map(s => {
      const lista = proyectos.filter(p => p.categoria === s.cat);
      if (!lista.length) return "";
      return `
        <section class="seccion">
          <h2>${esc(s.titulo)}</h2>
          <p class="nota">${esc(s.nota)}</p>
          <div class="grid">${lista.map(tarjeta).join("")}</div>
        </section>`;
    }).join("");
  }

  document.querySelectorAll(".filtros button").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(".filtros button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    pintar(b.dataset.cat);
  }));

  fetch("proyectos.json")
    .then(r => r.json())
    .then(data => { proyectos = data; pintar("todos"); })
    .catch(() => { grid.textContent = "No se pudo cargar proyectos.json."; });
</script>
</body>
</html>
